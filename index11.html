<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videos com html5</title>
</head>
<body>
   <body>

    <!-- <h1> = Tag de título principal da página.
         É o maior título e chama mais atenção. -->
    <h1>Vídeos hospedados localmente</h1>

    <!-- <p> = Tag de parágrafo.
         Serve para escrever textos e informações. -->
    <p>Este vídeo está hospedado no meu próprio servidor.</p>

    <!-- <video> = Tag de vídeo.
         Serve para colocar um vídeo na página.
         width="500" = Define a largura do vídeo.
         poster="..." = Mostra uma imagem de capa antes do vídeo começar.
         controls = Mostra os botões do vídeo (play, pause, volume, tela cheia). -->
    <video width="500" poster="imagens/OIP.png" controls>

        <!-- <source> = Tag de fonte do vídeo.
             Informa ao navegador onde está o arquivo do vídeo e qual é o formato.
             O navegador tenta abrir os vídeos de cima para baixo até encontrar um formato compatível. -->
        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/Meu-Video.mkv" type="video/mkv">
        <source src="midia/Meu-Video.webm" type="video/webm">
        <source src="midia/meu-video.ogv" type="video/ogg">

        <!-- <p> = Esse parágrafo só aparece se o navegador
             não conseguir reproduzir nenhum dos formatos de vídeo.
             Ele serve para avisar o usuário que o vídeo não pode ser exibido. -->
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>

    </video>

</body>
</html>
