<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videos com html5</title>
</head>
<body>
   <body>

    <!-- <h1> = Tag de título principal da página.
         É o maior título e chama mais atenção. -->
    <h1>Vídeos hospedados localmente</h1>

    <!-- <p> = Tag de parágrafo.
         Serve para escrever textos e informações. -->
    <p>Este vídeo está hospedado no meu próprio servidor.</p>

    <!-- <video> = Tag de vídeo.
         Serve para colocar um vídeo na página.
         width="500" = Define a largura do vídeo.
         poster="..." = Mostra uma imagem de capa antes do vídeo começar.
         controls = Mostra os botões do vídeo (play, pause, volume, tela cheia). -->
    <video width="560" poster="imagens/OIP.png" controls autoplay loop>

        <!-- <source> = Tag de fonte do vídeo.
             Informa ao navegador onde está o arquivo do vídeo e qual é o formato.
             O navegador tenta abrir os vídeos de cima para baixo até encontrar um formato compatível. -->
        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/Meu-Video.mkv" type="video/mkv">
        <source src="midia/Meu-Video.webm" type="video/webm">
        <source src="midia/meu-video.ogv" type="video/ogg">

        <!-- <p> = Esse parágrafo só aparece se o navegador
             não conseguir reproduzir nenhum dos formatos de vídeo.
             Ele serve para avisar o usuário que o vídeo não pode ser exibido. -->
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>

    </video>

<h1>Inserindo vídeos do YouTube</h1>

<!--
Como obter esse código no YouTube:

1. Abra o vídeo que você deseja colocar no seu site.
2. Clique em "Compartilhar".
3. Clique em "Incorporar" (Embed).
4. O YouTube mostrará um código HTML igual a este.
5. Copie esse código e cole dentro do <body> do seu site.

Pronto! O vídeo aparecerá na sua página.
-->

<!--
Tag <iframe>:
É usada para exibir uma página de outro site dentro da sua página.
Nesse caso, ela exibe um vídeo do YouTube.
-->
<iframe
    width="560"  <!-- Largura do vídeo -->
    height="315" <!-- Altura do vídeo -->

    <!-- Link do vídeo incorporado (embed). Esse link é fornecido pelo YouTube. -->
    src="https://www.youtube.com/embed/rx8EhkXk9zs?si=cW16iA_0MCkvXcNE"

    title="YouTube video player" <!-- Descrição do conteúdo -->

    frameborder="0" <!-- Remove a borda do vídeo -->

    <!-- Permissões para o funcionamento do vídeo -->
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

    <!-- Política de segurança ao acessar o vídeo -->
    referrerpolicy="strict-origin-when-cross-origin"

    <!-- Permite assistir em tela cheia -->
    allowfullscreen>
</iframe>

</body>
</html>
