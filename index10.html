<!DOCTYPE html> 

<html lang="pt-br"> <!-- Início do documento HTML e define o idioma como português do Brasil -->

<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>midias em html</title> <!-- Título que aparece na aba do navegador -->

</head>

<body>

    <h1>imagem dinamica</h1> <!-- Título principal da página -->

    <p>
        tente abrir este site em vários dispositivos diferentes
        ou simplesmente aumente ou diminua em seu navegador.
    </p>
    <!--<p> Parágrafo de texto -->

    <picture> <!-- Agrupa várias versões da mesma imagem -->

        <source media="(max-width: 750px)"
                srcset="imagens/foto-p.png"
                type="image/png">
        <!-- Se a tela tiver até 750px de largura, mostra a imagem pequena -->

        <source media="(max-width: 1000px)"
                srcset="imagens/foto-m.png"
                type="image/png">
        <!-- Se a tela tiver até 1000px, mostra a imagem média -->

        <img src="imagens/foto-g.png" alt="imagem flexivel">
        <!-- Imagem padrão. Será exibida quando nenhuma das condições acima for atendida -->

    </picture> <!-- Fim do grupo de imagens -->
   <h1>Reproduzindo áudio</h1> <!-- Título principal da página -->

<p>Vamos aprender a reproduzir áudios em HTML5.</p> <!-- Parágrafo com um pequeno texto -->

<audio preload="metadata" autoplay controls loop> <!-- Cria um player de áudio.
                                                       preload="metadata": carrega apenas informações do áudio.
                                                       autoplay: inicia o áudio automaticamente.
                                                       controls: mostra os controles (play, pausa, volume, etc.).
                                                       loop: faz o áudio repetir quando terminar. -->

    <source src="midia/My First True Love - Jeremy Korpas.mp3" type="audio/mpeg">
    <!-- Define o arquivo de áudio que será reproduzido.
         src: caminho do arquivo.
         type: informa o formato do arquivo (MP3). -->

    <p>
        Infelizmente seu navegador não consegue reproduzir áudio.
        <a href="midia/My First True Love - Jeremy Korpas.mp3">Clique aqui para baixar o arquivo MP3</a>
    </p>
    <!-- Este parágrafo só aparece se o navegador não suportar a tag <audio>.
         A tag <a> cria um link para que o usuário possa baixar o arquivo de áudio.
         href: indica o endereço do arquivo que será aberto ou baixado. -->

</audio> <!-- Fecha a tag de áudio -->
</body> 

</html>
